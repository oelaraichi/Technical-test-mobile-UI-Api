name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run API tests
        run: npm run test:api

      - name: Upload API report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-report
          path: api-report/
          if-no-files-found: ignore

  test-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Install Appium
        run: npm install -g appium

      - name: Install UiAutomator2 driver
        run: appium driver install uiautomator2

      - name: Run UI tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: npm run test:ui

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          if-no-files-found: ignore

  publish-reports:
    if: ${{ always() && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
    needs: [test-api]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download API report artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: api-report
          path: artifacts/api-report

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build static reports website
        run: |
          node <<'NODE'
          const fs = require('fs')
          const path = require('path')

          const mkdir = (p) => fs.mkdirSync(p, { recursive: true })
          const write = (p, c) => fs.writeFileSync(p, c, 'utf8')
          const exists = (p) => fs.existsSync(p)

          mkdir('site/ui')
          mkdir('site/api')

          const apiSrc = 'artifacts/api-report'
          if (exists(apiSrc) && fs.readdirSync(apiSrc).length > 0) {
            fs.cpSync(apiSrc, 'site/api', { recursive: true, force: true })
          } else {
            write(
              'site/api/index.html',
              '<!doctype html><html lang="en"><head><meta charset="utf-8" /><title>API Report</title></head><body><h1>API report unavailable</h1><p>No API report artifact was generated in this workflow run.</p></body></html>'
            )
          }

          write(
            'site/ui/index.html',
            '<!doctype html><html lang="en"><head><meta charset="utf-8" /><meta http-equiv="refresh" content="0; url=https://raw.githack.com/oelaraichi/Technical-test-mobile-UI-Api/05167a8/allure-report/index.html" /><title>UI Report Redirect</title></head><body><p>Redirecting to fallback UI report...</p><p>If redirect does not start, open <a href="https://raw.githack.com/oelaraichi/Technical-test-mobile-UI-Api/05167a8/allure-report/index.html">this link</a>.</p></body></html>'
          )

          if (!exists('site/api/index.html') && exists('site/api/api-report.html')) {
            fs.copyFileSync('site/api/api-report.html', 'site/api/index.html')
          }

          write(
            'site/index.html',
            '<!doctype html><html lang="en"><head><meta charset="utf-8" /><title>Automation Reports</title></head><body><h1>Automation Reports</h1><ul><li><a href="./ui/">UI report (Allure)</a></li><li><a href="./api/">API report (Mochawesome)</a></li></ul></body></html>'
          )
          NODE

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
